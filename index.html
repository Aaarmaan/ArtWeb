<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arman Mahmoudi | Artist</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="home">
<div class="scrim"></div>
<div id="container">
  <div class="home-left">
    <div class="name-block">
      <h1 class="artist"><span>ARMAN</span><span>MAHMOUDI</span></h1>
      <div class="rule"></div>
    </div>
    <div class="menu">
      <ul>
        <li><a href="gallery/">WORKS</a><span class="badge">NEW</span></li>
        <li><a href="about/">ABOUT</a></li>
        <li><a href="statement/">STATEMENT</a></li>
        <li><a href="cv/">CV</a></li>
        <li><a href="links/">LINKS</a></li>
        <li><a href="https://instagram.com/armanmahmoudi.art" target="_blank" rel="noopener">CONTACT</a></li>
      </ul>
    </div>
  </div>
</div>
<script>
(function(){
  var ctx=null;
  function ensureCtx(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ctx && ctx.state==='suspended'){ ctx.resume(); }
  }
  function blip(){
    ensureCtx();
    if(!ctx) return;
    var t=ctx.currentTime;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=720;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.09,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+0.1);
  }
  document.addEventListener('pointerdown', ensureCtx, {passive:true});
  document.addEventListener('keydown', ensureCtx);
  document.querySelectorAll('.menu a').forEach(function(a){
    a.addEventListener('mouseenter', blip);
    a.addEventListener('focus', blip);
    a.addEventListener('click', blip);
  });
})();
</script>
</body>
</html>
