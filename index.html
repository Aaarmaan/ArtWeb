<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Arman Mahmoudi — Painter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#536878;
    --bg-deep:#465763;
    --ink:#eef4f2;
    --ink-soft:rgba(238,244,242,.72);
    --paper:#f4f7f5;
    --paper-soft:rgba(244,247,245,.78);
    --line:rgba(244,247,245,.45);
    --card-sh:0 10px 30px rgba(10,25,32,.28);
    --overlay:rgba(13,34,38,.93);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#536878;
      --bg-deep:#42525e;
      --ink:#eef4f2;
      --ink-soft:rgba(238,244,242,.72);
      --paper:#f4f7f5;
      --paper-soft:rgba(244,247,245,.78);
      --line:rgba(244,247,245,.38);
      --card-sh:0 10px 30px rgba(0,0,0,.35);
      --overlay:rgba(8,22,25,.95);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  button{font-family:inherit; cursor:pointer; background:none; border:0; color:inherit}
  button,[role="button"],a.navlink{min-height:44px}

  /* ---------- header: name left, links right ---------- */
  .site-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding:38px clamp(20px,9vw,150px) 8px;
    max-width:1600px; margin:0 auto;
  }
  .brand{
    font-size:clamp(19px,2.4vw,29px); font-weight:300; letter-spacing:.14em;
    text-transform:uppercase; text-decoration:none; line-height:1.2; white-space:nowrap;
  }
  .brand b{font-weight:500}
  nav.main{display:flex; align-items:center; flex-wrap:wrap; gap:2px clamp(14px,2.6vw,32px); padding-top:4px}
  a.navlink{
    display:inline-flex; align-items:center;
    font-size:15px; text-decoration:none; color:var(--paper-soft); letter-spacing:.02em;
  }
  a.navlink.active{color:var(--paper); text-decoration:underline; text-underline-offset:7px; text-decoration-thickness:1px}
  a.navlink:hover{color:var(--paper)}
  a.ig{display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; margin:-10px -10px -10px -6px; color:var(--ink)}
  a.ig svg{width:19px; height:19px}

  /* ---------- shared page frame ---------- */
  main{max-width:760px; margin:0 auto; padding:10px 20px 30px}
  .page-head{text-align:center; margin:38px 0 30px}
  .page-head h2{
    font-size:12px; font-weight:400; letter-spacing:.42em; text-indent:.42em;
    text-transform:uppercase; color:var(--paper); margin:0;
  }
  .backlink{
    display:inline-flex; align-items:center; min-height:44px;
    font-size:14px; letter-spacing:.04em; color:var(--paper-soft); padding:6px 2px;
  }
  .backlink:hover{color:var(--paper)}

  /* ---------- gallery sections ---------- */
  section.group{margin-top:56px}
  section.group:first-child{margin-top:38px}
  .group-head{text-align:center; margin-bottom:30px}
  .group-head .rule{height:1px; background:var(--line); margin:0 4px 26px}
  section.group:first-child .rule{display:none}
  .group-head h2{
    font-size:12px; font-weight:400; letter-spacing:.42em; text-indent:.42em;
    text-transform:uppercase; color:var(--paper); margin:0;
  }
  .group-head p{font-size:13px; color:var(--paper-soft); margin:10px 0 0; letter-spacing:.04em}
  section.group.coll{margin-top:14px}
  .cover-one{max-width:520px; margin:0 auto}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:38px 40px; align-items:start}
  figure.work{margin:0}
  .thumb{
    position:relative; display:block; width:100%; padding:0; text-align:left;
    border-radius:12px; overflow:hidden; box-shadow:var(--card-sh);
    background:var(--bg-deep);
  }
  .thumb img{
    width:100%; height:100%; object-fit:cover; display:block;
    animation:kenburns 18s ease-in-out infinite alternate;
  }
  /* soft, slow zoom in and back out (Ken Burns) on the artwork photos */
  @keyframes kenburns{
    from{transform:scale(1.01) translate(0,0)}
    to{transform:scale(1.09) translate(-1.4%,-1.2%)}
  }
  .grid figure:nth-child(2n) .thumb img{animation-duration:23s; animation-delay:-7s}
  .grid figure:nth-child(3n) .thumb img{animation-duration:27s; animation-delay:-13s}
  .cover-one .thumb img{animation-duration:20s}
  .thumb .veil{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; text-align:center; padding:18px;
    background:rgba(10,30,34,.55); color:#fff; opacity:1;
  }
  .thumb .veil .v-cat{font-size:10px; letter-spacing:.38em; text-transform:uppercase; opacity:.85}
  .thumb .veil .v-title{font-size:19px; font-weight:400; letter-spacing:.12em; text-transform:uppercase; line-height:1.5}
  .thumb .veil .v-sub{font-size:12.5px; opacity:.9; line-height:1.6}
  .thumb:focus-visible{outline:2px solid var(--paper); outline-offset:3px}
  figcaption{
    display:flex; justify-content:space-between; gap:10px;
    padding-top:12px; font-size:13px; color:var(--paper);
  }
  figcaption .t{letter-spacing:.05em}
  figcaption .d{color:var(--paper-soft); white-space:nowrap}

  /* ---------- text pages ---------- */
  .prose{max-width:620px; margin:0 auto}
  .prose p{
    font-size:16.5px; line-height:1.95; color:var(--paper); margin:0 0 26px; letter-spacing:.01em;
  }
  .prose p.soft{color:var(--paper-soft); font-size:14.5px}
  .prose p.tight{margin-bottom:8px}
  .prose h3{
    font-size:11.5px; font-weight:400; letter-spacing:.38em; text-transform:uppercase;
    color:var(--paper); margin:52px 0 20px;
  }
  .prose h3:first-child{margin-top:6px}
  .prose .rule{height:1px; background:var(--line); margin:0 0 34px}
  .prose a{text-underline-offset:5px}
  .prose a:hover{color:#fff}
  .name-line{
    font-size:clamp(20px,3vw,26px); font-weight:300; letter-spacing:.1em;
    text-transform:uppercase; color:var(--paper); text-align:center; margin:6px 0 34px;
  }
  .link-row{display:flex; flex-direction:column; gap:6px; align-items:flex-start}
  .link-row a{
    display:inline-flex; align-items:center; min-height:44px;
    font-size:16px; color:var(--paper); text-underline-offset:5px; letter-spacing:.02em;
  }

  /* ---------- home: plain teal background, name and vertical menu on the left ---------- */
  body.home-mode .site-head, body.home-mode footer{display:none}
  body.home-mode main{max-width:none; margin:0; padding:0}
  .home-full{position:relative; height:100vh; height:100dvh; overflow:hidden; background:var(--bg)}
  .home-inner{
    position:relative; z-index:2; height:100%;
    display:flex; flex-direction:column; justify-content:center;
    padding:24px clamp(20px,9vw,150px);
  }
  .home-name{
    font-size:clamp(36px,6.4vw,68px); font-weight:300; letter-spacing:.13em;
    text-transform:uppercase; color:var(--paper); margin:0; line-height:1.28;
  }
  .home-name span{display:block}
  .home-rule{width:min(330px,62vw); height:1px; background:rgba(244,247,245,.65); margin:30px 0 10px}
  nav.home-menu{display:flex; flex-direction:column; align-items:flex-start}
  .home-menu button, .home-menu a{
    display:inline-flex; align-items:center; min-height:44px;
    font-size:15px; font-weight:300; letter-spacing:.34em; text-transform:uppercase;
    color:var(--paper-soft); text-decoration:none; padding:4px 2px; text-align:left;
  }
  .home-menu button:hover, .home-menu a:hover{color:var(--paper)}
  .home-menu button:focus-visible, .home-menu a:focus-visible{outline:2px solid var(--paper); outline-offset:3px}
  .home-menu .new{font-size:10px; letter-spacing:.22em; margin-left:14px; opacity:.75}

  /* ---------- footer ---------- */
  footer{
    max-width:1600px; margin:0 auto; padding:48px clamp(20px,9vw,150px) 42px;
  }
  footer .f-links{display:flex; flex-wrap:wrap; gap:4px clamp(14px,2.6vw,32px); align-items:center}
  footer .f-links a{
    display:inline-flex; align-items:center; min-height:44px;
    font-size:15px; color:var(--paper-soft); text-decoration:none; letter-spacing:.02em;
  }
  footer .f-links a:hover{color:var(--paper)}

  /* ---------- lightbox ---------- */
  .lb{
    position:fixed; inset:0; z-index:50; background:var(--overlay); color:#eef4f2;
    display:flex; flex-direction:column;
  }
  .lb[hidden]{display:none}
  .lb-top{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 14px;
  }
  .lb-count{font-size:13px; letter-spacing:.14em; opacity:.85}
  .lb-btn{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:44px; min-height:44px; padding:8px 12px; font-size:15px; color:#eef4f2;
    border:1px solid rgba(238,244,242,.35); border-radius:8px;
  }
  .lb-btn:hover{background:rgba(238,244,242,.12)}
  .lb-stage{position:relative; flex:1; min-height:0}
  .lb-view{
    position:absolute; inset:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }
  /* two stacked photo layers: the new photo fades in over the old one,
     so changing photos never flashes through an empty black frame */
  .lb-zoom{position:absolute; inset:0; transform-origin:center center; will-change:transform}
  .lb-zoom img{
    position:absolute; inset:0; margin:auto; width:auto; height:auto;
    max-width:100%; max-height:100%; object-fit:contain; border-radius:6px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    opacity:0; transition:opacity .55s ease;
    user-select:none; -webkit-user-select:none;
  }
  .lb-zoom img.show{opacity:1; z-index:2}
  .lb-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:3;
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; min-width:38px; min-height:38px; padding:0;
    border-radius:50%; border:1px solid rgba(238,244,242,.28);
    background:rgba(8,22,25,.42); color:#eef4f2; font-size:19px; line-height:1;
  }
  .lb-arrow:hover{background:rgba(8,22,25,.68)}
  .lb-arrow:disabled{opacity:.3}
  #lbPrev{left:10px}
  #lbNext{right:10px}
  .lb-cap{text-align:center; padding:14px 20px 26px}
  .lb-top,.lb-cap,.lb-arrow{transition:opacity .25s ease}
  .lb.ui-hidden .lb-top,.lb.ui-hidden .lb-cap,.lb.ui-hidden .lb-arrow{opacity:0; pointer-events:none}
  .lb-cap .c-cat{font-size:10.5px; letter-spacing:.38em; text-transform:uppercase; opacity:.75; margin:0 0 8px}
  .lb-cap .c-title{font-size:19px; font-weight:400; letter-spacing:.1em; text-transform:uppercase; margin:0}
  .lb-cap .c-sub{font-size:13.5px; opacity:.85; margin:8px 0 0; line-height:1.7}

  @media (max-width:640px){
    .site-head{flex-direction:column; gap:6px; padding-top:26px}
    nav.main{padding-top:0}
    .grid{grid-template-columns:1fr; gap:34px}
    footer{padding-top:40px}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .thumb img{animation:none}
    .lb-zoom img{transition:none}
    .lb-top,.lb-cap,.lb-arrow{transition:none}
  }
</style>
</head>
<body class="home-mode">

<header class="site-head">
  <a class="brand" href="#" data-nav="home">Arman <b>Mahmoudi</b></a>
  <nav class="main" aria-label="Main">
    <a class="navlink" href="#" data-nav="home">Home</a>
    <a class="navlink" href="#" data-nav="works">Works</a>
    <a class="navlink" href="#" data-nav="about">About</a>
    <a class="navlink" href="#" data-nav="statement">Statement</a>
    <a class="navlink" href="#" data-nav="cv">CV</a>
    <a class="navlink" href="#" data-nav="links">Links</a>
    <a class="ig" href="https://instagram.com/armanmahmoudi.art" target="_blank" rel="noopener" aria-label="Instagram — @armanmahmoudi.art">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
  </nav>
</header>

<main id="page" aria-live="polite">
  <!-- Home is the landing page: it is written into the page itself, so the
       site always opens here — the gallery only appears after choosing Works. -->
  <section class="home-full">
    <div class="home-inner">
      <h1 class="home-name"><span>Arman</span><span>Mahmoudi</span></h1>
      <div class="home-rule"></div>
      <nav class="home-menu" aria-label="Main">
        <a href="#" data-nav="home">Home</a>
        <a href="#" data-nav="works">Works<span class="new">New</span></a>
        <a href="#" data-nav="about">About</a>
        <a href="#" data-nav="statement">Statement</a>
        <a href="#" data-nav="cv">CV</a>
        <a href="#" data-nav="links">Links</a>
        <a href="https://instagram.com/armanmahmoudi.art" target="_blank" rel="noopener">Contact</a>
      </nav>
    </div>
  </section>
</main>

<footer>
  <nav class="f-links" aria-label="Footer">
    <a href="#" data-nav="home">Home</a>
    <a href="#" data-nav="works">Works</a>
    <a href="#" data-nav="about">About</a>
    <a href="#" data-nav="statement">Statement</a>
    <a href="#" data-nav="cv">CV</a>
    <a href="#" data-nav="links">Links</a>
  </nav>
</footer>

<div class="lb" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Artwork viewer">
  <div class="lb-top">
    <span class="lb-count" id="lbCount"></span>
    <button class="lb-btn" id="lbClose" aria-label="Close viewer">✕ Close</button>
  </div>
  <div class="lb-stage">
    <div class="lb-view" id="lbView">
      <div class="lb-zoom" id="lbZoom">
        <img id="lbImgA" alt="" draggable="false">
        <img id="lbImgB" alt="" draggable="false">
      </div>
    </div>
    <button class="lb-btn lb-arrow" id="lbPrev" aria-label="Previous work">‹</button>
    <button class="lb-btn lb-arrow" id="lbNext" aria-label="Next work">›</button>
  </div>
  <div class="lb-cap">
    <p class="c-cat" id="lbCat"></p>
    <p class="c-title" id="lbTitle"></p>
    <p class="c-sub" id="lbSub"></p>
  </div>
</div>

<script>
var GROUPS = [
  {
    id: "lev2022", label: "Levitation — 2022", meta: "Mixed Media · 50 × 70 cm", w: 700, h: 957,
    works: [
      { file: "g1-1.jpg", title: "Untitled", sub: "Mixed Media · 50 × 70 cm · 2022" },
      { file: "g1-2.jpg", title: "Untitled", sub: "Mixed Media · 50 × 70 cm · 2022" },
      { file: "g1-3.jpg", title: "Untitled", sub: "Mixed Media · 50 × 70 cm · 2022", w: 957, h: 700 },
      { file: "g1-4.jpg", title: "Untitled", sub: "Mixed Media · 50 × 70 cm · 2022" },
      { file: "g1-5.jpg", title: "Untitled", sub: "Mixed Media · 50 × 70 cm · 2022" }
    ]
  },
  {
    id: "lev2024", label: "Levitation — 2024", meta: "Mixed Media · 100 × 70 cm", w: 1000, h: 1368,
    works: [
      { file: "g2-1.png", title: "Untitled", sub: "Mixed Media · 100 × 70 cm · 2024" },
      { file: "g2-2.png", title: "Untitled", sub: "Mixed Media · 100 × 70 cm · 2024" },
      { file: "g2-3.png", title: "Untitled", sub: "Mixed Media · 100 × 70 cm · 2024" }
    ]
  },
  {
    id: "drawings", label: "Drawings", meta: "Works on paper · 2022 — 2025", w: 1280, h: 1754,
    works: [
      { file: "dr-1.jpg", title: "Drawing", sub: "2025" },
      { file: "dr-2.jpg", title: "Drawing", sub: "2025" },
      { file: "dr-3.jpg", title: "Drawing", sub: "2022" },
      { file: "dr-4.jpg", title: "Drawing", sub: "2022" },
      { file: "dr-5.jpg", title: "Drawing", sub: "2022" }
    ]
  }
];

var page = document.getElementById("page");
var view = { name: "home", id: null };

function groupById(id) {
  return GROUPS.filter(function (g) { return g.id === id; })[0];
}

function setActiveNav() {
  var key = view.name === "collection" ? "works" : view.name;
  document.querySelectorAll("a.navlink").forEach(function (a) {
    a.classList.toggle("active", a.getAttribute("data-nav") === key);
  });
}

function pageHead(title) {
  var head = document.createElement("div");
  head.className = "page-head";
  var h = document.createElement("h2");
  h.textContent = title;
  head.appendChild(h);
  return head;
}

function render() {
  page.innerHTML = "";
  document.body.classList.toggle("home-mode", view.name === "home");
  if (view.name === "home") renderHome();
  else if (view.name === "collection") renderCollection(groupById(view.id));
  else if (view.name === "about") renderAbout();
  else if (view.name === "statement") renderStatement();
  else if (view.name === "cv") renderCv();
  else if (view.name === "links") renderLinks();
  else renderWorks();
  setActiveNav();
  window.scrollTo(0, 0);
}

function go(name, id) {
  view = { name: name, id: id || null };
  render();
}

document.querySelectorAll("[data-nav]").forEach(function (a) {
  a.addEventListener("click", function (e) {
    e.preventDefault();
    go(a.getAttribute("data-nav"));
  });
});

/* ---------- Home: plain teal background, two-line name on the left, thin rule, vertical menu ---------- */
function renderHome() {
  var sec = document.createElement("section");
  sec.className = "home-full";
  var inner = document.createElement("div");
  inner.className = "home-inner";
  var h = document.createElement("h1");
  h.className = "home-name";
  h.innerHTML = "<span>Arman</span><span>Mahmoudi</span>";
  var rule = document.createElement("div");
  rule.className = "home-rule";
  var menu = document.createElement("nav");
  menu.className = "home-menu";
  menu.setAttribute("aria-label", "Main");
  var items = [
    { label: "Home", go: "home" },
    { label: "Works", go: "works", isNew: true },
    { label: "About", go: "about" },
    { label: "Statement", go: "statement" },
    { label: "CV", go: "cv" },
    { label: "Links", go: "links" }
  ];
  items.forEach(function (it) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = it.label;
    if (it.isNew) {
      var n = document.createElement("span");
      n.className = "new";
      n.textContent = "New";
      b.appendChild(n);
    }
    b.addEventListener("click", function () { go(it.go); });
    menu.appendChild(b);
  });
  var contact = document.createElement("a");
  contact.href = "https://instagram.com/armanmahmoudi.art";
  contact.target = "_blank";
  contact.rel = "noopener";
  contact.textContent = "Contact";
  menu.appendChild(contact);
  inner.appendChild(h);
  inner.appendChild(rule);
  inner.appendChild(menu);
  sec.appendChild(inner);
  page.appendChild(sec);
}

/* ---------- Works: one cover photo per collection, click opens the full collection ---------- */
function renderWorks() {
  GROUPS.forEach(function (g) {
    var w = g.works[0];
    var sec = document.createElement("section");
    sec.className = "group";
    var head = document.createElement("div");
    head.className = "group-head";
    head.innerHTML = '<div class="rule"></div><h2></h2><p></p>';
    head.querySelector("h2").textContent = g.label;
    head.querySelector("p").textContent = g.meta + " · " + g.works.length + " works";
    sec.appendChild(head);
    var wrap = document.createElement("div");
    wrap.className = "cover-one";
    var fig = document.createElement("figure");
    fig.className = "work";
    var btn = document.createElement("button");
    btn.className = "thumb";
    btn.style.aspectRatio = (w.w || g.w) + " / " + (w.h || g.h);
    btn.setAttribute("aria-label", "Open the " + g.label + " collection, " + g.works.length + " works");
    var img = document.createElement("img");
    img.src = "gallery/" + w.file;
    img.alt = w.title + ", " + g.label + " — Arman Mahmoudi";
    img.loading = "lazy";
    var veil = document.createElement("span");
    veil.className = "veil";
    veil.innerHTML = '<span class="v-cat"></span><span class="v-title"></span><span class="v-sub"></span>';
    veil.querySelector(".v-cat").textContent = g.label;
    veil.querySelector(".v-title").textContent = w.title;
    veil.querySelector(".v-sub").textContent = g.works.length + " works";
    btn.appendChild(img);
    btn.appendChild(veil);
    btn.addEventListener("click", function () { go("collection", g.id); });
    var cap = document.createElement("figcaption");
    var t = document.createElement("span"); t.className = "t"; t.textContent = w.title;
    var d = document.createElement("span"); d.className = "d"; d.textContent = w.sub;
    cap.appendChild(t); cap.appendChild(d);
    fig.appendChild(btn); fig.appendChild(cap);
    wrap.appendChild(fig);
    sec.appendChild(wrap);
    page.appendChild(sec);
  });
}

/* ---------- one collection: all its works, click opens the lightbox ---------- */
function makeThumb(w, g, onOpen) {
  var btn = document.createElement("button");
  btn.className = "thumb";
  btn.style.aspectRatio = (w.w || g.w) + " / " + (w.h || g.h);
  btn.setAttribute("aria-label", "View " + w.title + " — " + g.label + " full size");
  var img = document.createElement("img");
  img.src = "gallery/" + w.file;

  btn.addEventListener("click", onOpen);
  return btn;
}

  page.appendChild(sec);

/* ---------- lightbox: navigates within the open collection ---------- */
var lb = document.getElementById("lightbox");
var lbImgs = [document.getElementById("lbImgA"), document.getElementById("lbImgB")];
var lbActive = 0;
var lbFadeToken = 0;
var lbCount = document.getElementById("lbCount");
var lbCat = document.getElementById("lbCat");
var lbTitle = document.getElementById("lbTitle");
var lbSub = document.getElementById("lbSub");
var lbList = [];
var lbIndex = 0;
var lastFocus = null;

function swapLb(instant) {
  var w = lbList[lbIndex];
  var src = "gallery/" + w.file;
  var altText = w.title + ", " + w.cat + " — Arman Mahmoudi";
  lbCount.textContent = (lbIndex + 1) + " / " + lbList.length;
  lbCat.textContent = w.cat;
  lbTitle.textContent = w.title;
  lbSub.textContent = w.sub;
  document.getElementById("lbPrev").disabled = lbList.length < 2;
  document.getElementById("lbNext").disabled = lbList.length < 2;
  var token = ++lbFadeToken;
  if (instant) {
    var cur = lbImgs[lbActive];
    cur.src = src;
    cur.alt = altText;
    cur.classList.add("show");
    lbImgs[1 - lbActive].classList.remove("show");
    return;
  }
  /* crossfade: preload the new photo first, then fade it in over the
     current one — the old photo stays on screen underneath until the
     new one has fully faded in, so the stage never goes black */
  var nxt = lbImgs[1 - lbActive];
  var pre = new Image();
  pre.onload = function () {
    if (token !== lbFadeToken) return;
    nxt.src = src;
    nxt.alt = altText;
    nxt.style.zIndex = "3";
    void nxt.offsetWidth;
    nxt.classList.add("show");
    var old = lbImgs[lbActive];
    lbActive = 1 - lbActive;
    setTimeout(function () {
      if (lbImgs[lbActive] !== old) {
        old.classList.remove("show");
        old.style.zIndex = "";
      }
    }, 620);
  };
  pre.onerror = function () {
    if (token !== lbFadeToken) return;
    var c = lbImgs[lbActive];
    c.src = src;
    c.alt = altText;
    c.classList.add("show");
  };
  pre.src = src;
}
function showLb(instant) {
  lbZoom.style.transition = "";
  clearTimeout(zoomAnimTimer);
  resetZoom();
  swapLb(instant);
}
function openLb(list, index) {
  lbList = list;
  lbIndex = index;
  lastFocus = document.activeElement;
  lb.classList.remove("ui-hidden");
  showLb(true);
  lb.hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("lbClose").focus();
}
function closeLb() {
  lb.hidden = true;
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
function stepLb(d) {
  lbIndex = (lbIndex + d + lbList.length) % lbList.length;
  showLb();
}
document.getElementById("lbClose").addEventListener("click", closeLb);
document.getElementById("lbPrev").addEventListener("click", function () { stepLb(-1); });
document.getElementById("lbNext").addEventListener("click", function () { stepLb(1); });
lb.addEventListener("click", function (e) { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", function (e) {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") stepLb(-1);
  if (e.key === "ArrowRight") stepLb(1);
});
/* ---------- pinch zoom, pan, double-tap and swipe inside the lightbox ---------- */
var lbView = document.getElementById("lbView");
var lbZoom = document.getElementById("lbZoom");
var zoom = { scale: 1, tx: 0, ty: 0 };
var zoomAnimTimer = null;
var pointers = {};
var pinchStart = null;
var dragStart = null;
var lastTap = 0;
var tapTimer = null;

function applyZoom() {
  lbZoom.style.transform = "translate(" + zoom.tx + "px," + zoom.ty + "px) scale(" + zoom.scale + ")";
}
function resetZoom() {
  zoom = { scale: 1, tx: 0, ty: 0 };
  applyZoom();
}
function fitSize() {
  var r = lbView.getBoundingClientRect();
  var nw = lbImgs[lbActive].naturalWidth || r.width;
  var nh = lbImgs[lbActive].naturalHeight || r.height;
  var s = Math.min(r.width / nw, r.height / nh);
  return { w: nw * s, h: nh * s, vw: r.width, vh: r.height };
}
function clampPan() {
  var f = fitSize();
  var mx = Math.max(0, (f.w * zoom.scale - f.vw) / 2);
  var my = Math.max(0, (f.h * zoom.scale - f.vh) / 2);
  zoom.tx = Math.min(mx, Math.max(-mx, zoom.tx));
  zoom.ty = Math.min(my, Math.max(-my, zoom.ty));
}
function setZoom(scale, cx, cy) {
  var r = lbView.getBoundingClientRect();
  var px = (cx == null ? r.left + r.width / 2 : cx) - (r.left + r.width / 2);
  var py = (cy == null ? r.top + r.height / 2 : cy) - (r.top + r.height / 2);
  var ns = Math.min(4, Math.max(1, scale));
  var k = ns / zoom.scale;
  zoom.tx = px - (px - zoom.tx) * k;
  zoom.ty = py - (py - zoom.ty) * k;
  zoom.scale = ns;
  if (zoom.scale === 1) { zoom.tx = 0; zoom.ty = 0; }
  clampPan();
  applyZoom();
}
/* programmatic zooms (double-tap, mouse wheel) ease to their target
   instead of jumping; finger gestures clear this and track directly */
function smoothZoom(ms, fn) {
  lbZoom.style.transition = "transform " + ms + "ms cubic-bezier(.25,.8,.3,1)";
  fn();
  clearTimeout(zoomAnimTimer);
  zoomAnimTimer = setTimeout(function () { lbZoom.style.transition = ""; }, ms + 40);
}
lbView.addEventListener("pointerdown", function (e) {
  lbZoom.style.transition = "";
  clearTimeout(zoomAnimTimer);
  try { lbView.setPointerCapture(e.pointerId); } catch (err) {}
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(pointers);
  if (ids.length === 2) {
    var a = pointers[ids[0]], b = pointers[ids[1]];
    pinchStart = {
      d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
      scale: zoom.scale, tx: zoom.tx, ty: zoom.ty,
      cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2
    };
    dragStart = null;
  } else if (ids.length === 1) {
    dragStart = { x: e.clientX, y: e.clientY, tx: zoom.tx, ty: zoom.ty, moved: false };
  }
});
lbView.addEventListener("pointermove", function (e) {
  if (!pointers[e.pointerId]) return;
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  var ids = Object.keys(pointers);
  if (ids.length === 2 && pinchStart) {
    /* a whisper of easing while pinching, so the zoom glides instead of jittering */
    lbZoom.style.transition = "transform .06s linear";
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var d = Math.hypot(a.x - b.x, a.y - b.y);
    var cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    zoom.scale = pinchStart.scale; zoom.tx = pinchStart.tx; zoom.ty = pinchStart.ty;
    setZoom(pinchStart.scale * d / pinchStart.d, pinchStart.cx, pinchStart.cy);
    zoom.tx += cx - pinchStart.cx;
    zoom.ty += cy - pinchStart.cy;
    clampPan();
    applyZoom();
  } else if (ids.length === 1 && dragStart) {
    var dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) dragStart.moved = true;
    if (zoom.scale > 1) {
      zoom.tx = dragStart.tx + dx;
      zoom.ty = dragStart.ty + dy;
      clampPan();
      applyZoom();
    }
  }
});
function endPointer(e) {
  var wasDrag = dragStart;
  var wasPinch = !!pinchStart;
  delete pointers[e.pointerId];
  var ids = Object.keys(pointers);
  if (ids.length < 2) pinchStart = null;
  if (ids.length === 1) {
    var p = pointers[ids[0]];
    dragStart = { x: p.x, y: p.y, tx: zoom.tx, ty: zoom.ty, moved: true };
  } else if (ids.length === 0) {
    if (wasDrag && !wasPinch) {
      var dx = e.clientX - wasDrag.x;
      var dy = e.clientY - wasDrag.y;
      if (zoom.scale === 1 && Math.abs(dy) > 55 && Math.abs(dy) > Math.abs(dx)) {
        /* swipe up or down exits the photo */
        closeLb();
      } else if (zoom.scale === 1 && Math.abs(dx) > 55 && Math.abs(dy) < 80) {
        stepLb(dx < 0 ? 1 : -1);
      } else if (!wasDrag.moved) {
        var now = Date.now();
        if (now - lastTap < 320) {
          /* double-tap: zoom in on the tapped spot, double-tap again zooms back out */
          clearTimeout(tapTimer);
          if (zoom.scale > 1) smoothZoom(480, resetZoom);
          else smoothZoom(480, function () { setZoom(2.5, e.clientX, e.clientY); });
          lastTap = 0;
        } else {
          /* single tap toggles the buttons and caption, after waiting out a possible second tap */
          lastTap = now;
          clearTimeout(tapTimer);
          tapTimer = setTimeout(function () { lb.classList.toggle("ui-hidden"); }, 320);
        }
      }
    }
    dragStart = null;
  }
}
lbView.addEventListener("pointerup", endPointer);
lbView.addEventListener("pointercancel", endPointer);
lbView.addEventListener("wheel", function (e) {
  e.preventDefault();
  smoothZoom(180, function () {
    setZoom(zoom.scale * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX, e.clientY);
  });
}, { passive: false });
/* no dblclick listener: the browser fires it on top of the pointer-based
   double-tap above, which toggled zoom straight back off again */

render();
</script>
